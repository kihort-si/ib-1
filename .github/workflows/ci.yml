name: Secure API CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-sast:
    name: Tests and SpotBugs SAST
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests
        run: mvn --batch-mode --no-transfer-progress test

      - name: Run SpotBugs
        run: mvn --batch-mode --no-transfer-progress compile spotbugs:check

      - name: Upload SAST report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: target/reports/spotbugs.html
          if-no-files-found: warn

  dependency-scan:
    name: OWASP dependency scan (SCA)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Calculate Dependency-Check cache key
        id: odc-cache-key
        shell: bash
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore Dependency-Check database
        id: odc-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/dependency-check-data
          key: odc-${{ runner.os }}-v12-${{ steps.odc-cache-key.outputs.week }}
          restore-keys: |
            odc-${{ runner.os }}-v12-

      - name: Update vulnerability database
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: >-
          mvn --batch-mode --no-transfer-progress
          org.owasp:dependency-check-maven:update-only
          -DdataDirectory="${{ runner.temp }}/dependency-check-data"
          -DnvdApiKeyEnvironmentVariable=NVD_API_KEY
          -DnvdValidForHours=24

      - name: Save Dependency-Check database
        if: steps.odc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/dependency-check-data
          key: odc-${{ runner.os }}-v12-${{ steps.odc-cache-key.outputs.week }}

      - name: Run OWASP Dependency-Check
        run: >-
          mvn --batch-mode --no-transfer-progress
          org.owasp:dependency-check-maven:check
          -DdataDirectory="${{ runner.temp }}/dependency-check-data"
          -DautoUpdate=false

      - name: Upload SCA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-reports
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json
          if-no-files-found: warn
